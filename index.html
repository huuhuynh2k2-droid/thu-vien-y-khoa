<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thư Viện Y Khoa — BS. Huỳnh Hữu Minh</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A9%BA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f7f8fb;--surface:#ffffff;--ink:#0c1b33;--ink2:#4c5a72;--muted:#8b93a3;
  --grid:#e7ebf2;--border:rgba(12,27,51,.10);--wash:rgba(12,27,51,.05);
  --good:#158a4d;--warn:#b8790a;--crit:#c53434;--accent:#12305e;--accent2:#0b1e3d;--gold:#c9962c;--gold2:#e8b64a;
  --header-fg:#ffffff;
  --c-tm:#d94343;--c-hh:#0f9d6e;--c-th:#e0731f;--c-than:#1c62c9;--c-cxk:#b6790a;
  --c-nt:#c23e7d;--c-tk:#5b3fc2;--c-tq:#0f8f3d;--c-hscc:#0f7ea3;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#070d1a;--surface:#0f1a30;--ink:#eef1f7;--ink2:#aab4c6;--muted:#7c8598;
    --grid:#1c2740;--border:rgba(255,255,255,.10);--wash:rgba(255,255,255,.05);
    --good:#33c27c;--warn:#f0ab3d;--crit:#f07272;--accent:#4d7ec9;--accent2:#7fa6de;--gold:#e8b64a;--gold2:#f4cf7e;
    --c-tm:#ea7373;--c-hh:#33d29c;--c-th:#f2985a;--c-than:#5b93e0;--c-cxk:#e6b13f;
    --c-nt:#e884b2;--c-tk:#a290ec;--c-tq:#4fce7c;--c-hscc:#3fc4de;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#070d1a;--surface:#0f1a30;--ink:#eef1f7;--ink2:#aab4c6;--muted:#7c8598;
  --grid:#1c2740;--border:rgba(255,255,255,.10);--wash:rgba(255,255,255,.05);
  --good:#33c27c;--warn:#f0ab3d;--crit:#f07272;--accent:#4d7ec9;--accent2:#7fa6de;--gold:#e8b64a;--gold2:#f4cf7e;
  --c-tm:#ea7373;--c-hh:#33d29c;--c-th:#f2985a;--c-than:#5b93e0;--c-cxk:#e6b13f;
  --c-nt:#e884b2;--c-tk:#a290ec;--c-tq:#4fce7c;--c-hscc:#3fc4de;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,.nm,.v,.logo b{font-family:"Be Vietnam Pro",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px}

/* ---- hero header ---- */
.hero{background:linear-gradient(135deg,var(--accent2) 0%,var(--accent) 60%,#1c4a8c 100%);color:var(--header-fg);border-radius:0 0 26px 26px;padding:22px 0 34px;margin-bottom:-20px;box-shadow:0 2px 0 var(--gold) inset}
.hero-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px}
.avatar{position:relative;display:inline-flex;flex:none}
.avatar-badge{position:absolute;right:-3px;bottom:-3px;background:var(--gold);border:2px solid var(--accent2);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px}
.logo b{font-size:22px;font-weight:800;display:block;letter-spacing:.2px}
.logo .byline{font-size:13px;color:var(--gold2);font-weight:600;margin-top:1px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:rgba(255,255,255,.16);backdrop-filter:blur(2px);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:7px 14px;cursor:pointer;min-height:36px;text-decoration:none;color:#fff;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;transition:background .15s}
.btn:hover{background:rgba(255,255,255,.28)}
.hero-sub{max-width:1180px;margin:14px auto 0;padding:0 16px;font-size:13.5px;opacity:.95}

.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(4,1fr);margin-top:28px}
.mt{margin-top:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(24,20,16,.04)}
.card.tile{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.card.tile:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(24,20,16,.09)}
.card.tile[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-1px}
.tile .ic{font-size:18px;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.tile .v{font-size:30px;font-weight:800;line-height:1.15;margin-top:8px}
.tile .l{color:var(--ink2);font-size:13px;font-weight:600}
.tile .d{font-size:12.5px;margin-top:4px;color:var(--ink2)}
.tile.t-all{border-top:4px solid var(--gold)}
.tile.t-all .ic{background:color-mix(in srgb, var(--gold) 20%, transparent);color:var(--gold)}
.tile.t-done{border-top:4px solid var(--good)}
.tile.t-done .ic{background:color-mix(in srgb, var(--good) 18%, transparent)}
.tile.t-wip{border-top:4px solid var(--warn)}
.tile.t-wip .ic{background:color-mix(in srgb, var(--warn) 18%, transparent)}
.tile.t-todo{border-top:4px solid var(--muted)}
.tile.t-todo .ic{background:color-mix(in srgb, var(--muted) 18%, transparent)}

h2.section{font-size:16px;margin:26px 0 12px;font-weight:800;display:flex;align-items:center;gap:8px}
.sp-grid{grid-template-columns:repeat(3,1fr)}
.sp{cursor:pointer;text-align:left;width:100%;display:block;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:14px 16px 16px;position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s}
.sp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--sc)}
.sp:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(24,20,16,.09)}
.sp[aria-pressed="true"]{outline:2px solid var(--sc);outline-offset:-1px}
.sp .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sp .icwrap{display:flex;align-items:center;gap:9px}
.sp .ic{font-size:19px;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--sc);background:color-mix(in srgb, var(--sc) 18%, transparent)}
.sp .nm{font-weight:700;font-size:15px}
.sp .en{font-size:11.5px;color:var(--muted);font-style:italic}
.sp .cnt{font-size:26px;font-weight:800;margin-top:10px;color:var(--sc)}
.sp .cnt small{font-size:13px;font-weight:500;color:var(--ink2)}
.meter{height:7px;background:var(--grid);border-radius:99px;margin-top:8px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--sc);border-radius:99px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 12px}
.filters input,.filters select{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 12px;min-height:36px}
.filters input[type=search]{flex:1;min-width:200px}
.count{color:var(--ink2);font-size:13px;margin:0 0 8px}
.tw{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(24,20,16,.04)}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{position:sticky;top:0;background:linear-gradient(120deg,var(--accent2),var(--accent));color:#fff;text-align:left;font-weight:700;font-size:12.5px;letter-spacing:.2px;text-transform:uppercase;padding:11px 12px;white-space:nowrap;cursor:pointer;user-select:none}
tbody td{padding:11px 12px;border-top:1px solid var(--grid);vertical-align:top}
tbody tr:nth-child(even){background:var(--wash)}
tbody tr:hover{background:color-mix(in srgb, var(--gold) 12%, transparent)}
td .nm{font-weight:700;display:block}
td .cat{font-size:12.5px;color:var(--ink2);margin-top:2px}
td .note{font-size:12.5px;color:var(--ink2);margin-top:4px;max-width:420px}
td a.open{color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-weight:600}
.spdot{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.spdot i{width:9px;height:9px;border-radius:50%;background:var(--sc);flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px 3px 8px;white-space:nowrap}
.tag.done{background:color-mix(in srgb, var(--good) 16%, transparent);color:var(--good)}
.tag.wip{background:color-mix(in srgb, var(--warn) 18%, transparent);color:var(--warn)}
.tag.todo{background:var(--wash);color:var(--ink2)}
.dim{color:var(--muted);font-size:12.5px}
.foot{color:var(--ink2);font-size:13px;margin-top:26px;border-top:1px dashed var(--border);padding-top:16px;display:flex;align-items:center;gap:8px}
.foot .sig{font-size:19px}
.empty{padding:28px 16px;text-align:center;color:var(--ink2)}
.hide{display:none}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,1fr)}.sp-grid{grid-template-columns:1fr}}
@media (max-width:720px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tbody tr{padding:11px 12px;border-top:1px solid var(--grid)}
  tbody td{border:0;padding:3px 0}
  td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);font-weight:600}
}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-in">
    <div class="logo">
      <span class="avatar">
        <svg width="50" height="50" viewBox="0 0 52 52" aria-hidden="true">
          <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8b64a"/><stop offset="1" stop-color="#c9962c"/></linearGradient></defs>
          <circle cx="26" cy="26" r="24.5" fill="#0b1e3d" stroke="url(#g1)" stroke-width="2.5"/>
          <text x="26" y="32" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="16" fill="#fff">HHM</text>
        </svg>
        <span class="avatar-badge">🩺</span>
      </span>
      <div>
        <b>Thư Viện Y Khoa</b>
        <div class="byline">BS. Huỳnh Hữu Minh · Nội khoa</div>
      </div>
    </div>
    <div class="tools">
      <button class="btn" id="theme">🌓 Sáng / Tối</button>
      <a class="btn" id="toDash" href="#" target="_blank" rel="noopener">📋 Bảng theo dõi ôn thi</a>
    </div>
  </div>
  <div class="hero-sub" id="sub"></div>
</div>
<div class="wrap">

  <div class="grid tiles" id="tiles"></div>

  <h2 class="section">🗂️ Theo chuyên khoa</h2>
  <div class="grid sp-grid" id="spGrid"></div>

  <div class="filters">
    <input type="search" id="q" placeholder="🔎 Tìm tên bài, tổ chức, năm...">
    <select id="fSp"><option value="all">Tất cả chuyên khoa</option></select>
    <select id="fSt">
      <option value="all">Mọi trạng thái</option>
      <option value="2">Đã hoàn thành</option>
      <option value="1">Đang biên soạn</option>
      <option value="0">Chưa soạn / cần cập nhật</option>
    </select>
  </div>
  <p class="count" id="count"></p>
  <div class="tw"><table>
    <thead><tr>
      <th data-s="title">Tên bài / Chủ đề</th><th data-s="sp">Chuyên khoa</th><th data-s="org">Tổ chức / Nguồn</th><th data-s="year" class="dim">Năm</th><th data-s="status">Trạng thái</th><th>Ngày cập nhật</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table><div class="empty hide" id="empty">Chưa có bài nào khớp.</div></div>

  <p class="foot" id="foot"><span class="sig">✍️</span><span></span></p>
</div>
<script src="library-data.js"></script>
<script>
(function(){
"use strict";
var L=window.LIBRARY;
if(!L||!L.items){document.body.innerHTML='<div style="max-width:520px;margin:60px auto;padding:0 16px;font:15px/1.6 system-ui,sans-serif"><h1 style="font-size:20px">Chưa tải được dữ liệu thư viện</h1><p>Không tìm thấy <code>library-data.js</code> cạnh trang này.</p></div>';return}
var SP={};L.specialties.forEach(function(s){SP[s.id]=s});
var SPICON={tm:"🫀",hh:"🫁",th:"🍽️",than:"🩸",cxk:"🦴",nt:"🦋",tk:"🧠",tq:"🩺",hscc:"🚑"};
var STN={0:"Chưa soạn / cần cập nhật",1:"Đang biên soạn",2:"Đã hoàn thành"};
var STC={0:"todo",1:"wip",2:"done"};
var STICON={0:"⏳",1:"✍️",2:"✅"};
var S={theme:null};
try{var raw=localStorage.getItem("thuvien-theme");if(raw)S.theme=JSON.parse(raw)}catch(e){}
function applyTheme(){if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme")}
document.getElementById("theme").addEventListener("click",function(){var dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;S.theme=dark?"light":"dark";try{localStorage.setItem("thuvien-theme",JSON.stringify(S.theme))}catch(e){}applyTheme()});
applyTheme();
document.getElementById("toDash").href=L.dashboardUrl||"#";

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function openUrl(it){if(it.url)return it.url.indexOf("http")===0?it.url:it.url; if(it.notion)return it.notion; return""}
function fmtDate(s){if(!s)return"";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}

var F={q:"",sp:"all",st:"all",sort:"title",dir:1};

function renderTiles(){
  var n=L.items.length,done=L.items.filter(function(i){return i.status===2}).length,wip=L.items.filter(function(i){return i.status===1}).length,todo=n-done-wip;
  document.getElementById("tiles").innerHTML=
    tile("all","t-all","📚",n,"Tổng số bài","")+
    tile("2","t-done","✅",done,"Đã hoàn thành",n?Math.round(done/n*100)+"%":"")+
    tile("1","t-wip","✍️",wip,"Đang biên soạn","")+
    tile("0","t-todo","⏳",todo,"Chưa soạn / cần cập nhật","");
}
function tile(st,cls,ic,v,l,d){return'<button type="button" class="card tile '+cls+'" data-st="'+st+'" aria-pressed="'+(F.st===st)+'"><div class="ic">'+ic+'</div><div class="v">'+v+'</div><div class="l">'+l+'</div><div class="d">'+d+'</div></button>'}

function renderSpecialties(){
  var h="";
  L.specialties.forEach(function(s){
    var list=L.items.filter(function(i){return i.sp===s.id}),n=list.length,done=list.filter(function(i){return i.status===2}).length;
    h+='<button class="sp" style="--sc:var(--c-'+s.id+')" data-sp="'+s.id+'" aria-pressed="'+(F.sp===s.id)+'">'+
      '<div class="top"><div class="icwrap"><span class="ic">'+(SPICON[s.id]||"🩺")+'</span><span class="nm">'+esc(s.name)+'</span></div><span class="en">'+esc(s.en)+'</span></div>'+
      '<div class="cnt">'+done+'<small> / '+n+' đã có bản dịch</small></div>'+
      '<div class="meter"><span style="width:'+(n?done/n*100:0)+'%"></span></div></button>';
  });
  document.getElementById("spGrid").innerHTML=h;
}

function renderTable(){
  var q=F.q.trim().toLowerCase();
  var list=L.items.filter(function(it){
    if(F.sp!=="all"&&it.sp!==F.sp)return false;
    if(F.st!=="all"&&String(it.status)!==F.st)return false;
    if(q){var hay=(it.title+" "+(it.org||"")+" "+(it.year||"")+" "+(it.cat||"")).toLowerCase();if(hay.indexOf(q)<0)return false}
    return true;
  }).sort(function(a,b){
    var x=a[F.sort],y=b[F.sort];
    if(F.sort==="sp"){x=SP[a.sp]?SP[a.sp].name:"";y=SP[b.sp]?SP[b.sp].name:""}
    if(F.sort==="year"){x=x||0;y=y||0}
    var r=x<y?-1:x>y?1:0;return r*F.dir;
  });
  document.getElementById("count").textContent=list.length+" / "+L.items.length+" bài";
  document.getElementById("empty").classList.toggle("hide",list.length>0);
  document.getElementById("tb").innerHTML=list.map(function(it){
    var u=openUrl(it),sp=SP[it.sp]?SP[it.sp].name:it.sp;
    var nm=u?'<a class="open" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a>':esc(it.title);
    return '<tr><td data-l="Tên bài"><span class="nm">'+nm+'</span>'+(it.cat?'<div class="cat">'+esc(it.cat)+'</div>':'')+(it.note?'<div class="note">'+esc(it.note)+'</div>':'')+'</td>'+
      '<td data-l="Chuyên khoa"><span class="spdot" style="--sc:var(--c-'+it.sp+')"><i></i>'+esc(sp)+'</span></td>'+
      '<td data-l="Tổ chức / Nguồn">'+(it.doi?'<a class="open" href="'+esc(it.doi)+'" target="_blank" rel="noopener">'+esc(it.org||"Nguồn")+'</a>':esc(it.org||"–"))+'</td>'+
      '<td data-l="Năm" class="dim">'+(it.year||"–")+'</td>'+
      '<td data-l="Trạng thái"><span class="tag '+STC[it.status]+'">'+STICON[it.status]+' '+STN[it.status]+'</span></td>'+
      '<td data-l="Cập nhật">'+(fmtDate(it.updated)||"–")+'</td></tr>';
  }).join("");
}

function refresh(){renderTiles();renderSpecialties();renderTable()}
document.getElementById("tiles").addEventListener("click",function(e){
  var b=e.target.closest("[data-st]");if(!b)return;
  F.st=F.st===b.dataset.st?"all":b.dataset.st;
  document.getElementById("fSt").value=F.st;
  renderTiles();renderTable();
});
document.getElementById("spGrid").addEventListener("click",function(e){
  var b=e.target.closest("[data-sp]");if(!b)return;
  F.sp=F.sp===b.dataset.sp?"all":b.dataset.sp;
  document.getElementById("fSp").value=F.sp;
  renderSpecialties();renderTable();
});
document.getElementById("q").addEventListener("input",function(e){F.q=e.target.value;renderTable()});
document.getElementById("fSp").addEventListener("change",function(e){F.sp=e.target.value;renderSpecialties();renderTable()});
document.getElementById("fSt").addEventListener("change",function(e){F.st=e.target.value;renderTable()});
document.querySelector("thead").addEventListener("click",function(e){
  var th=e.target.closest("th");if(!th||!th.dataset.s)return;
  if(F.sort===th.dataset.s)F.dir*=-1;else{F.sort=th.dataset.s;F.dir=1}
  renderTable();
});
document.getElementById("fSp").innerHTML='<option value="all">Tất cả chuyên khoa</option>'+L.specialties.map(function(s){return'<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join("");

var gen="";try{gen=new Date(L.updated).toLocaleDateString("vi-VN")}catch(e){gen=L.updated}
document.getElementById("sub").textContent="Danh mục các bài dịch từ tài liệu y khoa quốc tế · Cập nhật lần cuối "+gen;
document.querySelector(".foot span:last-child").textContent="Mỗi bài là một trang HTML độc lập (dịch tiếng Việt, giữ nguyên hình/bảng số liệu quan trọng từ bản gốc). Gửi PDF cho Claude để thêm bài mới vào thư viện này.";
refresh();
})();
</script>
</body>
</html>
