<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thư Viện Y Khoa</title>
<style>
:root{
  color-scheme:light;
  --bg:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);
  --s1:#2a78d6;--s1-soft:#86b6ef;--wash:rgba(11,11,11,.05);
  --good:#0ca30c;--warn:#b57a00;--crit:#d03b3b;--accent:#2a78d6;--onaccent:#fff;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
    --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
    --s1:#3987e5;--s1-soft:#1c5cab;--wash:rgba(255,255,255,.06);
    --good:#0ca30c;--warn:#fab219;--accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
  --s1:#3987e5;--s1-soft:#1c5cab;--wash:rgba(255,255,255,.06);
  --good:#0ca30c;--warn:#fab219;--accent:#3987e5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:20px 0 8px}
h1{font-size:22px;margin:0;font-weight:650}
.sub{color:var(--ink2);font-size:13px;margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:34px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.btn:hover{background:var(--wash)}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(4,1fr)}
.mt{margin-top:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.tile .v{font-size:30px;font-weight:650;line-height:1.15}
.tile .l{color:var(--ink2);font-size:13px}
.tile .d{font-size:12.5px;margin-top:4px;color:var(--ink2)}
.sp-grid{grid-template-columns:repeat(3,1fr)}
.sp{cursor:pointer;text-align:left;width:100%;display:block;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px 16px}
.sp[aria-pressed="true"]{outline:2px solid var(--accent)}
.sp .top{display:flex;justify-content:space-between;align-items:baseline}
.sp .nm{font-weight:650;font-size:15px}
.sp .en{font-size:12px;color:var(--muted);font-style:italic}
.sp .cnt{font-size:26px;font-weight:650;margin-top:6px}
.sp .cnt small{font-size:13px;font-weight:400;color:var(--ink2)}
.meter{height:7px;background:var(--grid);border-radius:0 4px 4px 0;margin-top:8px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--s1)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 12px}
.filters input,.filters select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-height:34px}
.filters input[type=search]{flex:1;min-width:200px}
.count{color:var(--ink2);font-size:13px;margin:0 0 8px}
.tw{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{position:sticky;top:0;background:var(--ink);color:var(--bg);text-align:left;font-weight:600;font-size:13px;padding:9px 10px;white-space:nowrap;cursor:pointer;user-select:none}
tbody td{padding:10px;border-top:1px solid var(--grid);vertical-align:top}
tbody tr:hover{background:var(--wash)}
td .nm{font-weight:600;display:block}
td .cat{font-size:12.5px;color:var(--ink2);margin-top:2px}
td .note{font-size:12.5px;color:var(--ink2);margin-top:4px;max-width:420px}
td a.open{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border:1px solid var(--border);border-radius:99px;padding:1px 9px;white-space:nowrap}
.tag.done{background:rgba(12,163,12,.14);color:var(--good)}
.tag.wip{background:rgba(250,178,25,.18);color:var(--warn)}
.tag.todo{background:var(--wash);color:var(--ink2)}
.dim{color:var(--muted);font-size:12.5px}
.foot{color:var(--ink2);font-size:12.5px;margin-top:20px}
.empty{padding:28px 16px;text-align:center;color:var(--ink2)}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,1fr)}.sp-grid{grid-template-columns:1fr}}
@media (max-width:720px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tbody tr{padding:10px 12px;border-top:1px solid var(--grid)}
  tbody td{border:0;padding:2px 0}
  td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted)}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Thư Viện Y Khoa</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="tools">
      <button class="btn" id="theme">Sáng / Tối</button>
      <a class="btn" id="toDash" href="#" target="_blank" rel="noopener">Bảng theo dõi ôn thi</a>
    </div>
  </header>

  <div class="grid tiles" id="tiles"></div>

  <h2 style="font-size:16px;margin:22px 0 10px">Theo chuyên khoa</h2>
  <div class="grid sp-grid" id="spGrid"></div>

  <div class="filters">
    <input type="search" id="q" placeholder="Tìm tên bài, tổ chức, năm...">
    <select id="fSp"><option value="all">Tất cả chuyên khoa</option></select>
    <select id="fSt">
      <option value="all">Mọi trạng thái</option>
      <option value="2">Đã hoàn thành</option>
      <option value="1">Đang biên soạn</option>
      <option value="0">Chưa soạn / cần cập nhật</option>
    </select>
  </div>
  <p class="count" id="count"></p>
  <div class="tw"><table>
    <thead><tr>
      <th data-s="title">Tên bài / Chủ đề</th><th data-s="sp">Chuyên khoa</th><th data-s="org">Tổ chức / Nguồn</th><th data-s="year" class="dim">Năm</th><th data-s="status">Trạng thái</th><th>Ngày cập nhật</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table><div class="empty hide" id="empty">Chưa có bài nào khớp.</div></div>

  <p class="foot" id="foot"></p>
</div>
<script src="library-data.js"></script>
<script>
(function(){
"use strict";
var L=window.LIBRARY;
if(!L||!L.items){document.body.innerHTML='<div style="max-width:520px;margin:60px auto;padding:0 16px;font:15px/1.6 system-ui,sans-serif"><h1 style="font-size:20px">Chưa tải được dữ liệu thư viện</h1><p>Không tìm thấy <code>library-data.js</code> cạnh trang này.</p></div>';return}
var SP={};L.specialties.forEach(function(s){SP[s.id]=s});
var STN={0:"Chưa soạn / cần cập nhật",1:"Đang biên soạn",2:"Đã hoàn thành"};
var STC={0:"todo",1:"wip",2:"done"};
var S={theme:null};
try{var raw=localStorage.getItem("thuvien-theme");if(raw)S.theme=JSON.parse(raw)}catch(e){}
function applyTheme(){if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme")}
document.getElementById("theme").addEventListener("click",function(){var dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;S.theme=dark?"light":"dark";try{localStorage.setItem("thuvien-theme",JSON.stringify(S.theme))}catch(e){}applyTheme()});
applyTheme();
document.getElementById("toDash").href=L.dashboardUrl||"#";

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function openUrl(it){if(it.url)return it.url.indexOf("http")===0?it.url:it.url; if(it.notion)return it.notion; return""}
function fmtDate(s){if(!s)return"";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}

var F={q:"",sp:"all",st:"all",sort:"title",dir:1};

function renderTiles(){
  var n=L.items.length,done=L.items.filter(function(i){return i.status===2}).length,wip=L.items.filter(function(i){return i.status===1}).length,todo=n-done-wip;
  document.getElementById("tiles").innerHTML=
    tile(n,"Tổng số bài","")+
    tile(done,"Đã hoàn thành",n?Math.round(done/n*100)+"%":"")+
    tile(wip,"Đang biên soạn","")+
    tile(todo,"Chưa soạn / cần cập nhật","");
}
function tile(v,l,d){return'<div class="card tile"><div class="v">'+v+'</div><div class="l">'+l+'</div><div class="d">'+d+'</div></div>'}

function renderSpecialties(){
  var h="";
  L.specialties.forEach(function(s){
    var list=L.items.filter(function(i){return i.sp===s.id}),n=list.length,done=list.filter(function(i){return i.status===2}).length;
    h+='<button class="sp" data-sp="'+s.id+'" aria-pressed="'+(F.sp===s.id)+'"><div class="top"><span class="nm">'+esc(s.name)+'</span><span class="en">'+esc(s.en)+'</span></div><div class="cnt">'+done+'<small> / '+n+' đã có bản dịch</small></div><div class="meter"><span style="width:'+(n?done/n*100:0)+'%"></span></div></button>';
  });
  document.getElementById("spGrid").innerHTML=h;
}

function renderTable(){
  var q=F.q.trim().toLowerCase();
  var list=L.items.filter(function(it){
    if(F.sp!=="all"&&it.sp!==F.sp)return false;
    if(F.st!=="all"&&String(it.status)!==F.st)return false;
    if(q){var hay=(it.title+" "+(it.org||"")+" "+(it.year||"")+" "+(it.cat||"")).toLowerCase();if(hay.indexOf(q)<0)return false}
    return true;
  }).sort(function(a,b){
    var x=a[F.sort],y=b[F.sort];
    if(F.sort==="sp"){x=SP[a.sp]?SP[a.sp].name:"";y=SP[b.sp]?SP[b.sp].name:""}
    if(F.sort==="year"){x=x||0;y=y||0}
    var r=x<y?-1:x>y?1:0;return r*F.dir;
  });
  document.getElementById("count").textContent=list.length+" / "+L.items.length+" bài";
  document.getElementById("empty").classList.toggle("hide",list.length>0);
  document.getElementById("tb").innerHTML=list.map(function(it){
    var u=openUrl(it),sp=SP[it.sp]?SP[it.sp].name:it.sp;
    var nm=u?'<a class="open" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a>':esc(it.title);
    return '<tr><td data-l="Tên bài"><span class="nm">'+nm+'</span>'+(it.cat?'<div class="cat">'+esc(it.cat)+'</div>':'')+(it.note?'<div class="note">'+esc(it.note)+'</div>':'')+'</td>'+
      '<td data-l="Chuyên khoa">'+esc(sp)+'</td>'+
      '<td data-l="Tổ chức / Nguồn">'+(it.doi?'<a class="open" href="'+esc(it.doi)+'" target="_blank" rel="noopener">'+esc(it.org||"Nguồn")+'</a>':esc(it.org||"–"))+'</td>'+
      '<td data-l="Năm" class="dim">'+(it.year||"–")+'</td>'+
      '<td data-l="Trạng thái"><span class="tag '+STC[it.status]+'">'+STN[it.status]+'</span></td>'+
      '<td data-l="Cập nhật">'+(fmtDate(it.updated)||"–")+'</td></tr>';
  }).join("");
}

function refresh(){renderTiles();renderSpecialties();renderTable()}
document.getElementById("spGrid").addEventListener("click",function(e){
  var b=e.target.closest("[data-sp]");if(!b)return;
  F.sp=F.sp===b.dataset.sp?"all":b.dataset.sp;
  document.getElementById("fSp").value=F.sp;
  renderSpecialties();renderTable();
});
document.getElementById("q").addEventListener("input",function(e){F.q=e.target.value;renderTable()});
document.getElementById("fSp").addEventListener("change",function(e){F.sp=e.target.value;renderSpecialties();renderTable()});
document.getElementById("fSt").addEventListener("change",function(e){F.st=e.target.value;renderTable()});
document.querySelector("thead").addEventListener("click",function(e){
  var th=e.target.closest("th");if(!th||!th.dataset.s)return;
  if(F.sort===th.dataset.s)F.dir*=-1;else{F.sort=th.dataset.s;F.dir=1}
  renderTable();
});
document.getElementById("fSp").innerHTML='<option value="all">Tất cả chuyên khoa</option>'+L.specialties.map(function(s){return'<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join("");

var gen="";try{gen=new Date(L.updated).toLocaleDateString("vi-VN")}catch(e){gen=L.updated}
document.getElementById("sub").textContent="Danh mục các bài dịch từ tài liệu y khoa quốc tế. Cập nhật lần cuối "+gen+".";
document.getElementById("foot").textContent="Mỗi bài là một trang HTML độc lập (dịch tiếng Việt, giữ nguyên hình/bảng số liệu quan trọng từ bản gốc). Gửi PDF cho Claude để thêm bài mới vào thư viện này.";
refresh();
})();
</script>
</body>
</html>
